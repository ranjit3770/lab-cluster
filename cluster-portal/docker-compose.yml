version: '3.8'

services:
  # --------------------------------------------------------------------------
  # 1. Database: MariaDB Engine for Identity & Job Registry
  # --------------------------------------------------------------------------
  database:
    image: mariadb:10.6
    container_name: portal_database
    restart: always
    command: [
      "mysqld",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--max-connections=200",
      "--innodb-buffer-pool-size=512M"
    ]
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in cluster-portal/.env}
      MARIADB_DATABASE: strach_portal
      BACKEND_DB_USER: ${BACKEND_DB_USER:?Set BACKEND_DB_USER in cluster-portal/.env}
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:?Set BACKEND_DB_PASSWORD in cluster-portal/.env}
      JOB_API_DB_USER: ${JOB_API_DB_USER:?Set JOB_API_DB_USER in cluster-portal/.env}
      JOB_API_DB_PASSWORD: ${JOB_API_DB_PASSWORD:?Set JOB_API_DB_PASSWORD in cluster-portal/.env}
    ports:
      - "3307:3306"
    volumes:
      - portal_db_data:/var/lib/mysql
      - ./database/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portal_network

  # --------------------------------------------------------------------------
  # 2. Backend: Core Identity & Management Gateway (Scaled for 15 Users)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portal_backend
    restart: always
    network_mode: host
    # Scaling: Use Gunicorn with 4 workers for high concurrency
    entrypoint: ["gunicorn", "-w", "4", "-k", "uvicorn.workers.UvicornWorker", "app.main:app", "--bind", "0.0.0.0:8000", "--timeout", "120", "--access-logfile", "-", "--error-logfile", "-"]
    environment:
      - MYSQL_SERVER=localhost
      - MYSQL_PORT=3307
      - MYSQL_USER=${BACKEND_DB_USER:?Set BACKEND_DB_USER in cluster-portal/.env}
      - MYSQL_PASSWORD=${BACKEND_DB_PASSWORD:?Set BACKEND_DB_PASSWORD in cluster-portal/.env}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in cluster-portal/.env}
      - JOB_API_DB_USER=${JOB_API_DB_USER:?Set JOB_API_DB_USER in cluster-portal/.env}
      - JOB_API_DB_PASSWORD=${JOB_API_DB_PASSWORD:?Set JOB_API_DB_PASSWORD in cluster-portal/.env}
      - MYSQL_DB=strach_portal
      - DATA_STORAGE=/data_storage
      - EXTERNAL_JOB_API_URL=http://localhost:9000
      - SLURM_REST_URL=http://127.0.0.1:6820/slurm/v0.0.41
      - SLURM_VERSION=v0.0.41
      - SLURM_JWT_USER=slurmapi
      - SLURM_REST_TIMEOUT_SECONDS=2
      - SLURM_JWT_FAILURE_TTL_SECONDS=30
      - METRICS_ENABLED=${METRICS_ENABLED:-1}
      # Portal-submitted jobs need nodes that can read/write /data_storage.
      # Override this env with a comma-separated list after mounting shared storage on workers.
      - PORTAL_SLURM_NODELIST=${PORTAL_SLURM_NODELIST:-head-node}
      # Dual-boot playbooks are mounted read-only into the container.
      - WINDOWS_PLAYBOOK_DIR=/playbooks/os-switching
    volumes:
      - /data_storage:/data_storage
      - /etc/slurm:/etc/slurm:ro
      - /var/run/munge/munge.socket.2:/var/run/munge/munge.socket.2:ro
      - /run/slurmrestd:/run/slurmrestd:ro
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /usr/local/slurm:/usr/local/slurm:ro
      - ${CLUSTER_SETUP_DIR:-/opt/amritacluster/SLURM-COMPLETE-SETUP}/ansible/playbooks/os-switching:/playbooks/os-switching:ro
      - ./backend/entrypoint.sh:/app/entrypoint.sh:ro
    entrypoint: ["/app/entrypoint.sh", "gunicorn", "-w", "4", "-k", "uvicorn.workers.UvicornWorker", "app.main:app", "--bind", "0.0.0.0:8000", "--timeout", "120", "--access-logfile", "-", "--error-logfile", "-"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      database:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # 3. Job-API: Compute Fabrication & Slurm Dispatcher (Production Optimized)
  # --------------------------------------------------------------------------
  job-api:
    build:
      context: ./backend/job-api
      dockerfile: Dockerfile
    container_name: portal_job_api
    restart: always
    network_mode: host
    # Scaling: Use Gunicorn with 4 workers for workload dispatch stability
    environment:
      - MYSQL_SERVER=localhost
      - MYSQL_PORT=3307
      - MYSQL_USER=slurm_user
      - MYSQL_PASSWORD=${JOB_API_DB_PASSWORD:?Set JOB_API_DB_PASSWORD in cluster-portal/.env}
      - MYSQL_DB=slurm_jobs
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in cluster-portal/.env}
      - DATA_ROOT=/data_storage
      - SLURM_REST_URL=http://127.0.0.1:6820/slurm/v0.0.41
      - SLURM_VERSION=v0.0.41
      - SLURM_JWT_USER=slurmapi
      - SLURM_REST_TIMEOUT_SECONDS=2
      - SLURM_JWT_FAILURE_TTL_SECONDS=30
      - METRICS_ENABLED=${METRICS_ENABLED:-1}
    volumes:
      - /data_storage:/data_storage
      - /etc/slurm:/etc/slurm:ro
      - /var/run/munge/munge.socket.2:/var/run/munge/munge.socket.2:ro
      - /run/slurmrestd:/run/slurmrestd:ro
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - /usr/local/slurm:/usr/local/slurm:ro
      - ./backend/entrypoint.sh:/app/entrypoint.sh:ro
    entrypoint: ["/app/entrypoint.sh", "gunicorn", "-w", "4", "-k", "uvicorn.workers.UvicornWorker", "app.main:app", "--bind", "0.0.0.0:9000", "--timeout", "300", "--access-logfile", "-", "--error-logfile", "-"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      database:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # 4. Frontend: High-Fidelity Management Dashboard
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
    container_name: portal_frontend
    restart: always
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - portal_network

  # --------------------------------------------------------------------------
  # 5. MCP Server: HPC Operations MCP (AI tool interface)
  # --------------------------------------------------------------------------
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: portal_mcp_server
    restart: always
    network_mode: host
    entrypoint: ["gunicorn", "-w", "2", "-k", "uvicorn.workers.UvicornWorker", "app.main:app", "--bind", "0.0.0.0:9100", "--timeout", "120", "--access-logfile", "-", "--error-logfile", "-"]
    environment:
      - PORTAL_API_URL=http://localhost:8000
      - JOB_API_URL=http://localhost:9000
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in cluster-portal/.env}
      - ALGORITHM=HS256
      - MYSQL_SERVER=localhost
      - MYSQL_PORT=3307
      - MYSQL_USER=${BACKEND_DB_USER:?Set BACKEND_DB_USER in cluster-portal/.env}
      - MYSQL_PASSWORD=${BACKEND_DB_PASSWORD:?Set BACKEND_DB_PASSWORD in cluster-portal/.env}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in cluster-portal/.env}
      - MYSQL_DB=strach_portal
      - MCP_REQUIRE_AUTH=${MCP_REQUIRE_AUTH:-true}
      - MCP_AUDIT_ENABLED=${MCP_AUDIT_ENABLED:-true}
      - SLURM_PATH=/usr/local/slurm/bin:/usr/local/slurm/sbin
      - SLURM_LIB_PATH=/usr/local/slurm/lib
    volumes:
      - /etc/slurm:/etc/slurm:ro
      - /var/run/munge/munge.socket.2:/var/run/munge/munge.socket.2:ro
      - /usr/local/slurm:/usr/local/slurm:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      database:
        condition: service_healthy

networks:
  portal_network:
    driver: bridge

volumes:
  portal_db_data:
