# --- CLUSTER IDENTIFICATION ---
ClusterName=demo-cluster
ControlMachine=cluster-hn
ControlAddr=192.168.196.250

# --- AUTHENTICATION & SECURITY ---
AuthType=auth/munge
CryptoType=crypto/munge
MpiDefault=none

# --- ACCOUNTING & DATABASE ---
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=cluster-hn
AccountingStoragePort=6819
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=30

# --- PROCESS & TASK TRACKING ---
ProctrackType=proctrack/linuxproc
TaskPlugin=task/affinity

# --- PORTS & DIRECTORIES ---
SlurmctldPort=6817
SlurmdPort=6818
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld
SlurmdUser=root

# --- LOGGING ---
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldPidFile=/var/run/slurm/slurmctld.pid
MailProg=/usr/bin/mail


# --- GRES SETTINGS ---
GresTypes=gpu

# --- NODE DEFINITIONS ---
# Head Node: (GRES is empty to prevent mismatch errors if iGPU is disabled in BIOS)
NodeName=cluster-hn NodeAddr=192.168.196.250 Sockets=1 CoresPerSocket=6 ThreadsPerCore=1 CPUs=6 RealMemory=7000 State=UNKNOWN

# Workers: Using the 'intel' type to match gres.conf exactly
NodeName=worker1    NodeAddr=192.168.196.85  Sockets=1 CoresPerSocket=6 ThreadsPerCore=2 CPUs=12 RealMemory=6000 Feature=w1 Gres=gpu:intel:1 State=UNKNOWN
NodeName=worker2    NodeAddr=192.168.196.86  Sockets=1 CoresPerSocket=6 ThreadsPerCore=2 CPUs=12 RealMemory=6000 Feature=w2 Gres=gpu:intel:1 State=UNKNOWN

# --- PARTITION DEFINITIONS ---
PartitionName=main Nodes=cluster-hn,worker1,worker2 Default=YES MaxTime=INFINITE State=UP
