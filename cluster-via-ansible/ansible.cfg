[defaults]
# --- Core Settings ---
inventory       = /opt/amritacluster/cluster-via-ansible
forks           = 50
sudo_user       = root
remote_user     = root
# Set this to True in final production once host keys are known
host_key_checking = False 

# --- Performance & Gathering ---
# 'smart' gathering only collects facts when they are missing
gathering       = smart
fact_caching    = jsonfile
fact_caching_connection = /tmp/ansible_fact_cache
# Cache facts for 24 hours to speed up repeated runs
fact_caching_timeout = 86400

# --- Output & Logging ---
# Makes output much more readable than the default format
stdout_callback = default
# Useful for identifying slow-running benchmarking or config tasks
callbacks_enabled = timer, profile_tasks
# Ensure all actions are audited
log_path        = /tmp/ansible.log

# --- Error Handling ---
# Ensures a failure on one node doesn't stop the whole cluster run
any_errors_fatal = False

# Suppress deprecation warning
inject_facts_as_vars = False

[privilege_escalation]
become          = True
become_method   = sudo
become_user     = root
become_ask_pass = False

[ssh_connection]
# --- The 'Performance' Section ---
# Reduces SSH overhead significantly. Requires 'requiretty' to be disabled in /etc/sudoers
pipelining = True

# Reuse SSH connections to reduce handshake latency
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

# Control path to avoid long-path errors on some filesystems
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

[colors]
# Optional: Highlighting for easier visual scanning
highlight = white
verbose = blue
warn = bright purple
error = red
ok = green
changed = yellow
diff_add = green
diff_remove = red