---
- name: Generate and Sync Munge Key
  hosts: head_nodes,cluster_nodes
  become: yes
  tasks:
    # --- SECTION 1: PREPARATION ON HEAD NODE ---
    - name: Ensure munge is installed on Head Node
      apt:
        name: munge
        state: present
      when: "'head_nodes' in group_names"

    - name: Generate Munge key on Head Node
      shell: mungekey --create || true
      args:
        creates: /etc/munge/munge.key
      when: "'head_nodes' in group_names"

    - name: Set permissions on Head Node key
      file:
        path: /etc/munge/munge.key
        owner: munge
        group: munge
        mode: '0400'
      when: "'head_nodes' in group_names"

    - name: Read Munge key securely from Head Node
      slurp:
        src: /etc/munge/munge.key
      register: munge_key_data
      when: "'head_nodes' in group_names"
      run_once: true

    # --- SECTION 2: WORKER NODES ---
    - name: Save Munge key contents to Worker Nodes
      copy:
        content: "{{ hostvars[groups['head_nodes'][0]]['munge_key_data']['content'] | b64decode }}"
        dest: /etc/munge/munge.key
        owner: munge
        group: munge
        mode: '0400'
      when: "'cluster_nodes' in group_names"

    # --- SECTION 3: RESTART SERVICES ---
    - name: Restart Munge service on all nodes
      service:
        name: munge
        state: restarted
