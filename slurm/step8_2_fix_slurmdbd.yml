---
- name: Setup Slurm Database and Accounting
  hosts: head_nodes
  become: yes
  vars:
    db_name: "slurm_acct_db"
    db_user: "slurm"
    db_password: "slurm123"
    cluster_hn: "{{ inventory_hostname }}"

  tasks:
    - name: Install MySQL development headers
      package:
        name: 
          - libmariadb-dev
          - libmariadb-dev-compat
          - mysql-common
        state: present
    
    - name: 1. Install Dependencies
      package:
        name: [mariadb-server, slurmdbd, python3-pymysql, munge]
        state: present

    - name: 2. Ensure Slurm User Exists
      user:
        name: slurm
        shell: /bin/false
        system: yes
        state: present

    - name: 3. Ensure Prerequisite Services are Running
      service:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop: [mariadb, munge]

    - name: 4. Configure MariaDB for Slurm
      mysql_db:
        name: "{{ db_name }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Create Slurm Database User
      mysql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        priv: "{{ db_name }}.*:ALL"
        state: present
        host: "localhost"
        plugin: mysql_native_password
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: 5. Fix Directory Permissions
      file:
        path: "{{ item }}"
        state: directory
        owner: slurm
        group: slurm
        mode: '0755'
      loop: [/var/spool/slurmctld, /var/run/slurm, /var/log/slurm, /etc/slurm]

    - name: 6. Initialize Log File (Corrected Syntax)
      file:
        path: /var/log/slurm/slurmdbd.log
        state: touch
        owner: slurm
        group: slurm
        mode: '0644'

    - name: 7. Generate slurmdbd.conf
      copy:
        dest: /etc/slurm/slurmdbd.conf
        content: |
          AuthType=auth/munge
          DbdAddr=127.0.0.1
          DbdHost={{ cluster_hn }}
          SlurmUser=slurm
          LogFile=/var/log/slurm/slurmdbd.log
          PidFile=/var/run/slurm/slurmdbd.pid
          StorageType=accounting_storage/mysql
          StorageHost=localhost
          StoragePass={{ db_password }}
          StorageUser={{ db_user }}
          StorageLoc={{ db_name }}
        owner: slurm
        group: slurm
        mode: '0600'

    - name: 8. Smart Update slurm.conf
      replace:
        path: /etc/slurm/slurm.conf
        regexp: "^#? *{{ item.key }}=.*"
        replace: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: 'AccountingStorageType', value: 'accounting_storage/slurmdbd' }
        - { key: 'AccountingStorageHost', value: "{{ cluster_hn }}" }
        - { key: 'AccountingStoragePort', value: '6819' }

    - name: 9. Force Path Symlinks (Source-Built Slurm Path)
      file:
        path: "/usr/local/slurm/etc"
        state: directory
        owner: slurm
        group: slurm

    - name: Create Symlinks
      file:
        src: "/etc/slurm/{{ item }}"
        dest: "/usr/local/slurm/etc/{{ item }}"
        state: link
        force: yes
      loop: [slurm.conf, slurmdbd.conf]

    - name: 10. Start SlurmDBD
      systemd:
        name: slurmdbd
        state: restarted
        enabled: yes
        daemon_reload: yes

    - name: 11. Wait for SlurmDBD to become active
      pause:
        seconds: 5

    - name: 12. Final Validation Check
      command: systemctl is-active slurmdbd
      register: slurmdbd_status
      changed_when: false
      # If it's still "activating", this retry logic will give it more time
      until: slurmdbd_status.rc == 0
      retries: 5
      delay: 2
