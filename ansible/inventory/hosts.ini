[head_nodes]
head_node ansible_host=172.17.181.171 ansible_ip=172.17.181.171 ansible_connection=ssh

[cluster_nodes]
; worker_node1 ansible_host=172.17.181.168
; worker_node2 ansible_host=172.17.181.169
; worker_node3 ansible_host=172.17.181.170

[head_nodes:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3

[cluster_nodes:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3

[windows_nodes]
; windows_worker_node1 ansible_host=172.17.181.168
; windows_worker_node2 ansible_host=172.17.181.169
; windows_worker_node3 ansible_host=172.17.181.170

[windows_nodes:vars]
ansible_user=Administrator
ansible_password="{{ win_admin_pass }}"
ansible_connection=winrm
ansible_winrm_server_cert_validation=ignore
ansible_winrm_transport=ntlm
ansible_port=5985
ansible_winrm_scheme=http
