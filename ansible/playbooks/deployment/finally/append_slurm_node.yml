---
- name: Confirm the Slurm node append request
  hosts: localhost
  gather_facts: no
  vars_prompt:
    - name: new_node_name
      prompt: "Inventory host name to append from hosts.ini, e.g. worker_node1"
      private: no
    - name: append_confirmation
      prompt: "Type append to prepare only this new node and update Slurm config"
      private: no

  tasks:
    - name: Validate append request
      ansible.builtin.assert:
        that:
          - append_confirmation | lower == 'append'
          - new_node_name | length > 0
          - new_node_name in groups['cluster_nodes']
          - new_node_name not in groups['head_nodes']
          - hostvars[new_node_name]['ansible_host'] is defined
        fail_msg: >-
          Append was not confirmed, or {{ new_node_name }} is not a worker in
          hosts.ini [cluster_nodes] with ansible_host. Add the new worker to
          hosts.ini first, then run this playbook again.

    - name: Create temporary group for the new Slurm node
      ansible.builtin.add_host:
        name: "{{ new_node_name }}"
        groups: new_slurm_nodes

- name: Read shared cluster material from the head node
  hosts: head_nodes
  become: yes
  gather_facts: no
  vars:
    src_dir: "/usr/src"
    target_version: "26.05.3"

  tasks:
    - name: Ensure Munge is installed on the head node
      ansible.builtin.apt:
        name: munge
        state: present

    - name: Ensure the head node has a Munge key
      ansible.builtin.command: mungekey --create
      args:
        creates: /etc/munge/munge.key

    - name: Enforce Munge key permissions on the head node
      ansible.builtin.file:
        path: /etc/munge/munge.key
        owner: munge
        group: munge
        mode: '0400'

    - name: Read Munge key from the head node
      ansible.builtin.slurp:
        src: /etc/munge/munge.key
      register: head_munge_key_data

    - name: Check whether the Slurm source archive already exists on the head node
      ansible.builtin.stat:
        path: "{{ src_dir }}/slurm-{{ target_version }}.tar.bz2"
      register: head_slurm_archive

    - name: Fetch Slurm source archive from the head node cache when available
      ansible.builtin.fetch:
        src: "{{ src_dir }}/slurm-{{ target_version }}.tar.bz2"
        dest: "/tmp/slurm-{{ target_version }}.tar.bz2"
        flat: yes
      when: head_slurm_archive.stat.exists

- name: Prepare and install Slurm on only the new worker node
  hosts: new_slurm_nodes
  become: yes
  gather_facts: yes
  vars:
    head_inventory_name: "{{ groups['head_nodes'][0] }}"
    head_node_name: "{{ head_inventory_name | replace('_', '-') }}"
    src_dir: "/usr/src"
    slurm_prefix: "/usr/local/slurm"
    slurm_sysconfdir: "/etc/slurm"
    target_version: "26.05.3"
    slurm_enable_cgroups: "{{ enable_slurm_cgroups | default(false) }}"

  tasks:
    - name: Ensure hostname matches the Slurm NodeName
      ansible.builtin.hostname:
        name: "{{ inventory_hostname | replace('_', '-') }}"

    - name: Ensure the head node resolves locally on the new worker
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^\S+\s+{{ head_node_name }}(\s|$)'
        line: "{{ hostvars[head_inventory_name]['ansible_host'] }} {{ head_node_name }} {{ head_inventory_name }}"

    - name: Ensure the new worker resolves its own Slurm name locally
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s+'
        line: "127.0.1.1 {{ inventory_hostname | replace('_', '-') }} {{ inventory_hostname }}"

    - name: Fix interrupted dpkg configuration on the new worker
      ansible.builtin.command: dpkg --configure -a
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: false
      failed_when: false

    - name: Install Slurm build and runtime dependencies on the new worker
      ansible.builtin.apt:
        name:
          - build-essential
          - curl
          - libhttp-parser-dev
          - libhwloc-dev
          - libjson-c-dev
          - libjwt-dev
          - libmariadb-dev
          - libmariadb-dev-compat
          - libmunge-dev
          - libmysqlclient-dev
          - libpam0g-dev
          - libssl-dev
          - munge
          - mysql-common
          - pkg-config
          - python3
        state: present
        update_cache: yes
        force_apt_get: yes
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Ensure Slurm group exists on the new worker
      ansible.builtin.group:
        name: slurm
        system: yes
        state: present

    - name: Ensure Slurm user exists on the new worker
      ansible.builtin.user:
        name: slurm
        group: slurm
        system: yes
        shell: /bin/bash
        create_home: yes
        state: present
        comment: "Slurm Workload Manager"

    - name: Create Munge directories on the new worker
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: munge
        group: munge
        mode: "{{ item.mode }}"
      loop:
        - { path: '/etc/munge', mode: '0700' }
        - { path: '/var/lib/munge', mode: '0700' }
        - { path: '/var/log/munge', mode: '0750' }
        - { path: '/run/munge', mode: '0755' }

    - name: Copy the existing cluster Munge key to the new worker
      ansible.builtin.copy:
        content: "{{ hostvars[head_inventory_name]['head_munge_key_data']['content'] | b64decode }}"
        dest: /etc/munge/munge.key
        owner: munge
        group: munge
        mode: '0400'

    - name: Ensure Munge is running on the new worker
      ansible.builtin.systemd:
        name: munge
        state: restarted
        enabled: yes

    - name: Copy Slurm source archive from the head node cache when available
      ansible.builtin.copy:
        src: "/tmp/slurm-{{ target_version }}.tar.bz2"
        dest: "{{ src_dir }}/slurm-{{ target_version }}.tar.bz2"
        mode: '0644'
      when: hostvars[head_inventory_name]['head_slurm_archive']['stat']['exists']

    - name: Check if Slurm source archive exists on the new worker
      ansible.builtin.stat:
        path: "{{ src_dir }}/slurm-{{ target_version }}.tar.bz2"
      register: new_worker_slurm_archive

    - name: Download Slurm source archive only if it is not available locally
      ansible.builtin.get_url:
        url: "https://download.schedmd.com/slurm/slurm-{{ target_version }}.tar.bz2"
        dest: "{{ src_dir }}/slurm-{{ target_version }}.tar.bz2"
        mode: '0644'
        timeout: 60
      register: new_worker_slurm_download
      retries: 3
      delay: 10
      until: new_worker_slurm_download is succeeded
      when: not new_worker_slurm_archive.stat.exists

    - name: Extract Slurm source archive on the new worker
      ansible.builtin.unarchive:
        src: "{{ src_dir }}/slurm-{{ target_version }}.tar.bz2"
        dest: "{{ src_dir }}"
        remote_src: yes

    - name: Build and install Slurm on the new worker only when missing
      ansible.builtin.shell: |
        cd {{ src_dir }}/slurm-{{ target_version }}
        ./configure --prefix={{ slurm_prefix }} --sysconfdir={{ slurm_sysconfdir }} --with-munge --with-hwloc --with-jwt --enable-slurmrestd
        make -j$(nproc)
        make install
      args:
        creates: "{{ slurm_prefix }}/sbin/slurmd"

    - name: Ensure Slurm configuration directory exists on the new worker
      ansible.builtin.file:
        path: "{{ slurm_sysconfdir }}"
        state: directory
        owner: slurm
        group: slurm
        mode: '0755'

    - name: Check for legacy Slurm configuration path on the new worker
      ansible.builtin.stat:
        path: "{{ slurm_prefix }}/etc"
      register: new_worker_etc_path_status

    - name: Remove legacy Slurm configuration directory on the new worker
      ansible.builtin.file:
        path: "{{ slurm_prefix }}/etc"
        state: absent
      when:
        - new_worker_etc_path_status.stat.exists
        - new_worker_etc_path_status.stat.isdir
        - not new_worker_etc_path_status.stat.islnk

    - name: Link Slurm prefix configuration path to /etc/slurm on the new worker
      ansible.builtin.file:
        src: "{{ slurm_sysconfdir }}"
        dest: "{{ slurm_prefix }}/etc"
        state: link
        force: yes

    - name: Install Slurm PATH profile on the new worker
      ansible.builtin.copy:
        dest: /etc/profile.d/slurm.sh
        content: |
          export PATH={{ slurm_prefix }}/bin:{{ slurm_prefix }}/sbin:$PATH
          export LD_LIBRARY_PATH={{ slurm_prefix }}/lib:$LD_LIBRARY_PATH
        mode: '0644'

    - name: Create Slurm runtime directories on the new worker
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: slurm
        group: slurm
        mode: '0755'
        recurse: yes
      loop:
        - /etc/slurm
        - /var/run/slurm
        - /run/slurm
        - /var/log/slurm
        - /var/spool/slurmd
        - /var/spool/slurm
        - /var/spool/slurmctld

    - name: Keep Slurm runtime directories across reboot on the new worker
      ansible.builtin.copy:
        dest: /etc/tmpfiles.d/slurm.conf
        content: |
          d     /var/run/slurm   0755 slurm slurm -   -
          d     /run/slurm       0755 slurm slurm -   -
        mode: '0644'

    - name: Deploy Slurm cgroup enforcement on the new worker when enabled
      ansible.builtin.copy:
        dest: /etc/slurm/cgroup.conf
        owner: slurm
        group: slurm
        mode: '0644'
        content: |
          CgroupPlugin=autodetect
          EnableControllers=yes
          IgnoreSystemd=no
          ConstrainCores=yes
          ConstrainRAMSpace=yes
          ConstrainSwapSpace=yes
          ConstrainDevices=yes
          AllowedRAMSpace=100
          AllowedSwapSpace=0
      when: slurm_enable_cgroups | bool

    - name: Deploy Slurm cgroup v1 compatibility config on the new worker in stable mode
      ansible.builtin.copy:
        dest: /etc/slurm/cgroup.conf
        owner: slurm
        group: slurm
        mode: '0644'
        content: |
          CgroupPlugin=cgroup/v1
      when: not (slurm_enable_cgroups | bool)

    - name: Deploy slurmd service on the new worker
      ansible.builtin.copy:
        dest: /etc/systemd/system/slurmd.service
        mode: '0644'
        content: |
          [Unit]
          Description=Slurm node daemon
          After=network.target munge.service
          Requires=munge.service

          [Service]
          Environment="LD_LIBRARY_PATH={{ slurm_prefix }}/lib"
          Type=simple
          ExecStart={{ slurm_prefix }}/sbin/slurmd -D
          Restart=always
          User=root

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd on the new worker
      ansible.builtin.systemd:
        daemon_reload: yes

- import_playbook: ../slurm/step8_configure_slurm_dynamic.yml

- name: Reconfigure Slurm controller after adding the node
  hosts: head_nodes
  become: yes
  gather_facts: no
  vars:
    slurm_bin: "/usr/local/slurm/bin"

  tasks:
    - name: Ensure slurmctld is running
      ansible.builtin.systemd:
        name: slurmctld
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Reconfigure slurmctld to load the new node definition
      ansible.builtin.command: "{{ slurm_bin }}/scontrol reconfigure"
      changed_when: false

- name: Start and verify Slurm on the new worker
  hosts: new_slurm_nodes
  become: yes
  gather_facts: no

  tasks:
    - name: Clear failed slurmd state on the new worker
      ansible.builtin.command: systemctl reset-failed slurmd
      changed_when: false
      failed_when: false

    - name: Start slurmd on the new worker
      ansible.builtin.systemd:
        name: slurmd
        state: restarted
        enabled: yes
        daemon_reload: yes

    - name: Verify slurmd is active on the new worker
      ansible.builtin.command: systemctl is-active slurmd
      register: new_worker_slurmd_state
      changed_when: false
      retries: 12
      delay: 5
      until: new_worker_slurmd_state.stdout == "active"

- name: Resume and verify the appended Slurm node
  hosts: head_nodes
  become: yes
  gather_facts: no
  vars:
    slurm_bin: "/usr/local/slurm/bin"
    appended_node_name: "{{ groups['new_slurm_nodes'][0] | replace('_', '-') }}"

  tasks:
    - name: Wait for the new slurmd heartbeat
      ansible.builtin.pause:
        seconds: 20

    - name: Resume the appended node if Slurm accepts the transition
      ansible.builtin.shell:
        cmd: |
          output=$({{ slurm_bin }}/scontrol update nodename="{{ appended_node_name }}" state=resume 2>&1)
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "Resume accepted: {{ appended_node_name }}"
          elif echo "$output" | grep -qi "Invalid node state transition"; then
            echo "Skipping resume: $output"
          else
            echo "$output"
            exit "$rc"
          fi
      register: append_resume_result
      changed_when: "'Resume accepted:' in append_resume_result.stdout"

    - name: Show appended node resume result
      ansible.builtin.debug:
        msg: "{{ append_resume_result.stdout_lines }}"

    - name: Read appended node state from Slurm
      ansible.builtin.shell:
        cmd: |
          {{ slurm_bin }}/scontrol show node "{{ appended_node_name }}" -o | awk '
            {
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^State=/) {
                  state = tolower($i)
                  sub(/^state=/, "", state)
                  print state
                }
              }
            }
          '
      register: appended_node_state
      changed_when: false

    - name: Show appended node state
      ansible.builtin.debug:
        msg: "{{ appended_node_name }} state={{ appended_node_state.stdout }}"

    - name: Fail if the appended node is still unhealthy
      ansible.builtin.fail:
        msg: "{{ appended_node_name }} is still {{ appended_node_state.stdout }}"
      when: appended_node_state.stdout is search('down|drain|inval|invalid|unk|unknown|fail')

    - name: Show final Slurm partition state
      ansible.builtin.command: "{{ slurm_bin }}/sinfo"
      register: append_sinfo
      changed_when: false

    - name: Display final Slurm partition state
      ansible.builtin.debug:
        msg: "{{ append_sinfo.stdout_lines }}"

- name: Verify existing worker services were not broken
  hosts: cluster_nodes
  become: yes
  gather_facts: no

  tasks:
    - name: Check slurmd state on every worker
      ansible.builtin.command: systemctl is-active slurmd
      register: worker_slurmd_state
      changed_when: false
      failed_when: false

    - name: Show worker slurmd state
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} slurmd={{ worker_slurmd_state.stdout }}"

    - name: Fail if any worker slurmd is not active
      ansible.builtin.fail:
        msg: "{{ inventory_hostname }} slurmd is {{ worker_slurmd_state.stdout }}"
      when: worker_slurmd_state.stdout != "active"
