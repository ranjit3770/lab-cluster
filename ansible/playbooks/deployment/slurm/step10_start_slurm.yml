---
- name: Fix Slurm Version Mismatch and Rebuild REST Plugins
  hosts: head_nodes
  become: yes
  vars:
    slurm_bin_path: "/usr/local/slurm/bin"
    slurm_sbin_path: "/usr/local/slurm/sbin"
    slurm_lib_path: "/usr/local/slurm/lib"
    slurm_source_base: "/usr/local/src"

  tasks:
    - name: 1. Get exact running Slurm version
      ansible.builtin.shell: "{{ slurm_bin_path }}/sinfo -V | awk '{print $2}'"
      register: current_version
      changed_when: false

    - name: 2. Install Compilation Dependencies
      ansible.builtin.apt:
        name: [libjwt-dev, libjson-c-dev, libhttp-parser-dev, build-essential, wget, bzip2]
        state: present

    - name: 3. Download and Rebuild Slurm (Matching {{ current_version.stdout }})
      block:
        - name: 3a. Ensure source directory exists
          ansible.builtin.file:
            path: "{{ slurm_source_base }}/slurm-{{ current_version.stdout }}"
            state: directory

        - name: 3b. Download matching source
          ansible.builtin.unarchive:
            src: "https://download.schedmd.com/slurm/slurm-{{ current_version.stdout }}.tar.bz2"
            dest: "{{ slurm_source_base }}/slurm-{{ current_version.stdout }}"
            remote_src: yes
            extra_opts: [--strip-components=1]
            creates: "{{ slurm_source_base }}/slurm-{{ current_version.stdout }}/configure"

        - name: 3c. Configure, Build, and Install
          ansible.builtin.shell: |
            ./configure --prefix=/usr/local/slurm --sysconfdir=/usr/local/slurm/etc --with-jwt=/usr
            make -j$(nproc)
            make install
          args:
            chdir: "{{ slurm_source_base }}/slurm-{{ current_version.stdout }}"
          # This forces a clean overwrite of those version 25.11.4 plugins
          register: build_result

    - name: 4. Clean up incompatible plugins (Emergency Measure)
      ansible.builtin.shell: "rm -f {{ slurm_lib_path }}/slurm/*v0_0_42.so"
      when: build_result is successful
      # v0_0_42 is specifically from version 25.11

    - name: 5. Verify and Restart Services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
        daemon_reload: yes
      loop: [slurmdbd, slurmctld, slurmrestd]
