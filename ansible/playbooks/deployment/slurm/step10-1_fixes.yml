---
- name: Fix Slurm Accounting and Resume Nodes
  hosts: head_nodes,cluster_nodes
  become: yes
  vars:
    head_node_name: "head-node"
    slurm_bin_path: "/usr/local/slurm/bin"

  tasks:
    - name: 1. Ensure Accounting is ENABLED in slurm.conf
      replace:
        path: /etc/slurm/slurm.conf
        regexp: "{{ item.regexp }}"
        replace: "{{ item.replace }}"
      loop:
        - { regexp: '^AccountingStorageType=.*', replace: 'AccountingStorageType=accounting_storage/slurmdbd' }
        - { regexp: '^#\s*(AccountingStorageHost=.*)', replace: '\1' }
        - { regexp: '^#\s*(AccountingStoragePort=.*)', replace: '\1' }
      register: slurm_conf

    - name: 2. Restart Slurm Services
      systemd:
        name: "{{ item }}"
        state: restarted
      loop: "{{ ('head_nodes' in group_names) | ternary(['slurmdbd', 'slurmctld'], ['slurmd']) }}"
      when: slurm_conf.changed or force_restart | default(false)

    - name: 3. Wait for services to settle
      pause:
        seconds: 5

    - name: 4. Resume DOWN/DRAIN/FAIL/UNKNOWN Nodes
      delegate_to: head_node
      run_once: true
      shell:
        cmd: |
          export PATH={{ slurm_bin_path }}:$PATH
          # Wait a few seconds for slurmd daemons on workers to heartbeat to the controller
          sleep 5
          nodes_to_resume=$({{ slurm_bin_path }}/scontrol show node -o | awk '
            {
              node = ""
              state = ""
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^NodeName=/) {
                  node = $i
                  sub(/^NodeName=/, "", node)
                }
                if ($i ~ /^State=/) {
                  state = tolower($i)
                  sub(/^state=/, "", state)
                  gsub(/[+*~#$@%]/, " ", state)
                }
              }
              if (node != "" && state ~ /(^| )(down|drain|drained|draining|fail|failing|unk|unknown)( |$)/) {
                print node
              }
            }
          ')
          if [ -z "$nodes_to_resume" ]; then
            echo "No DOWN/DRAIN/FAIL/UNKNOWN nodes need resuming."
            exit 0
          fi

          failed=0
          for node in $nodes_to_resume; do
            output=$({{ slurm_bin_path }}/scontrol update nodename="$node" state=resume 2>&1)
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "Resume accepted: $node"
            elif echo "$output" | grep -qi "Invalid node state transition"; then
              echo "Skipping $node: $output"
            else
              echo "Failed to resume $node: $output"
              failed=1
            fi
          done
          exit "$failed"
      register: resume_output
      changed_when: "'Resume accepted:' in resume_output.stdout"
      when: "'head_nodes' in group_names"

    - name: 5. Show Resume Result
      debug:
        msg: "{{ resume_output.stdout if resume_output.stdout is defined else 'No nodes needed resuming' }}"
      when: "'head_nodes' in group_names"
